<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Shield & Book Composition -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Central Shield Glow -->
    <path d="M 256 90 L 390 140 C 390 270 330 360 256 410 C 182 360 122 270 122 140 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="6" />

    <!-- Open Book Vector -->
    <!-- Left Page -->
    <path d="M 256 280 C 220 250 170 248 135 258 C 135 340 185 345 256 370 Z" fill="#ffffff" />
    <!-- Right Page -->
    <path d="M 256 280 C 292 250 342 248 377 258 C 377 340 327 345 256 370 Z" fill="#e0e7ff" />
    <!-- Book Center Line -->
    <path d="M 256 276 L 256 372" stroke="#4338ca" stroke-width="5" stroke-linecap="round" />

    <!-- Empathy Heart / Guiding Star at top -->
    <circle cx="256" cy="195" r="38" fill="url(#goldGrad)" />
    <!-- Graduation Cap / Torch Symbol inside -->
    <path d="M 256 172 L 282 187 L 256 202 L 230 187 Z" fill="#ffffff" />
    <path d="M 272 195 L 272 214 C 272 220 240 220 240 214 L 240 195" fill="none" stroke="#ffffff" stroke-width="3" />

    <!-- Wings of Counseling / Moderasi Beragama (Olive branch / feathers) -->
    <path d="M 180 200 C 150 200 130 180 120 160 C 140 165 170 180 180 200 Z" fill="url(#accentGrad)" />
    <path d="M 332 200 C 362 200 382 180 392 160 C 372 165 342 180 332 200 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Typography Badge: BK 7, 8, 9 SMPN 7 -->
  <rect x="106" y="405" width="300" height="48" rx="24" fill="#ffffff" filter="url(#shadow)" />
  <text x="256" y="437" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#312e81" letter-spacing="1">MODUL BK 7, 8, 9</text>
</svg>
